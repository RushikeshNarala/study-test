name: Upload MTA TAR + mta.yaml to OneDrive (UAT)

on:
  push:
    branches:
      - uat
  workflow_dispatch:

jobs:
  upload-to-onedrive-uat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cloud Foundry CLI
        run: |
          curl -sL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=8.8.3&source=github-rel" | tar -zx
          sudo mv cf8 /usr/local/bin/
          cf8 --version

      - name: Install MBT
        run: npm install -g mbt

      - name: Install MTA Plugin
        run: |
          cf8 install-plugin -f https://github.com/cloudfoundry-incubator/multiapps-cli-plugin/releases/latest/download/multiapps-plugin.linux64

      - name: Build MTA Archive (mta.tar)
        run: |
          mbt build -t gen --mtar mta.tar
          ls -lh gen/

      - name: Set filename and folder for UAT
        id: filename
        run: |
          DATE=$(date +"%Y-%m-%d")
          FOLDER="Deployments/CPAWSB/UAT"
          TAR_FILE="mta_UAT_${DATE}.tar"
          YAML_FILE="mta_UAT_${DATE}.yaml"
          echo "folder=$FOLDER" >> $GITHUB_OUTPUT
          echo "tarfile=$TAR_FILE" >> $GITHUB_OUTPUT
          echo "yamlfile=$YAML_FILE" >> $GITHUB_OUTPUT

      - name: Get Access Token
        id: get_token
        run: |
          response=$(curl -s -X POST -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -d "grant_type=client_credentials" \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token")
          echo "token=$(echo $response | jq -r '.access_token')" >> $GITHUB_OUTPUT

      - name: Upload mta.tar to OneDrive (UAT)
        env:
          TOKEN: ${{ steps.get_token.outputs.token }}
          ONEDRIVE_USER: ${{ secrets.ONEDRIVE_USER }}
          FOLDER: ${{ steps.filename.outputs.folder }}
          TAR_FILE: ${{ steps.filename.outputs.tarfile }}
        run: |
          echo "Uploading ${TAR_FILE}"
          curl -X PUT "https://graph.microsoft.com/v1.0/users/${ONEDRIVE_USER}/drive/root:/${FOLDER}/${TAR_FILE}:/content" \
            -H "Authorization: Bearer $TOKEN" \
            --data-binary @gen/mta.tar

      - name: Upload mta.yaml to OneDrive (UAT)
        env:
          TOKEN: ${{ steps.get_token.outputs.token }}
          ONEDRIVE_USER: ${{ secrets.ONEDRIVE_USER }}
          FOLDER: ${{ steps.filename.outputs.folder }}
          YAML_FILE: ${{ steps.filename.outputs.yamlfile }}
        run: |
          echo "Uploading ${YAML_FILE}"
          curl -X PUT "https://graph.microsoft.com/v1.0/users/${ONEDRIVE_USER}/drive/root:/${FOLDER}/${YAML_FILE}:/content" \
            -H "Authorization: Bearer $TOKEN" \
            --data-binary @mta.yaml
